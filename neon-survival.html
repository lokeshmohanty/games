<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Survival — Arcade Games</title>
    <!--
      The standalone single-player page. It is now a redirect.

      Neon Survival used to exist twice: once here as a solo game, and once in
      games/neon-survival-mp.js as a co-op one. Two copies of the same game
      drift, and the split forced a choice on the portal — "single player" or
      "multiplayer" — that stopped being true the moment bots existed. The
      co-op module seats one player perfectly well, so it is the only copy now.

      This page stays so that a bookmark, a shared link or a home-screen
      shortcut from before the merge still lands on the game. It redirects with
      `location.replace` so it does not sit in the back-button history, and the
      `<link rel="canonical">` plus the meta refresh cover the case where
      scripts do not run at all.
    -->
    <link rel="canonical" href="neon-survival-mp.html" />
    <meta http-equiv="refresh" content="0; url=neon-survival-mp.html" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Arcade Games" />
    <link rel="stylesheet" href="lib/styles.css" />
  </head>
  <body>
    <div class="lobby">
      <h1 class="lobby-title">NEON SURVIVAL</h1>
      <p class="lobby-sub">
        Neon Survival has moved — it is one game now, playable alone, with bots,
        or with friends.
      </p>
      <div class="lobby-row">
        <a class="neon-btn neon-btn--accent" href="neon-survival-mp.html"
          >PLAY NEON SURVIVAL</a
        >
        <a class="neon-btn" href="index.html">ALL GAMES</a>
      </div>
    </div>
    <script src="lib/pwa.js"></script>
    <script>
      // Replace rather than assign: BACK from the game should leave the arcade
      // the way it came in, not bounce through this page forever.
      location.replace("neon-survival-mp.html");
    </script>
  </body>
</html>
