<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Profile · Arcade Games</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <!-- The theme first: tokens + fonts, and the saved choice before paint. -->
    <link rel="stylesheet" href="lib/theme.css" />
    <script src="lib/theme.js"></script>
    <link rel="stylesheet" href="lib/styles.css" />
    <style>
      /* One column, phone first: 16px gutters, every control 44px tall. */
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 64px 16px 48px;
      }
      h1 {
        color: var(--accent);
        text-shadow: 0 0 14px var(--accent-glow);
        font-size: 1.6rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin: 0 0 18px;
      }
      section {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        padding: 14px 16px;
        margin-bottom: 14px;
      }
      section h2 {
        margin: 0 0 10px;
        font-size: 0.8rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .who {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .who img {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 2px solid var(--accent);
      }
      .who .name {
        font-size: 1.3rem;
        font-weight: bold;
        overflow-wrap: anywhere;
      }
      .muted {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .row + .row {
        margin-top: 10px;
      }
      input[type="text"] {
        flex: 1 1 10rem;
        min-width: 0;
        min-height: 44px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
      }
      .neon-btn {
        min-height: 44px;
        padding: 10px 16px;
        font-size: 0.85rem;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
      }
      .toggle input {
        width: 22px;
        height: 22px;
        accent-color: var(--accent);
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid var(--border);
      }
      .item:first-of-type {
        border-top: none;
      }
      .item .grow {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--rule);
        margin-right: 6px;
      }
      .dot.on {
        background: var(--good);
        box-shadow: 0 0 6px var(--good);
      }
      .party-mini {
        min-height: 40px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      th,
      td {
        text-align: left;
        padding: 6px 4px;
        border-top: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-weight: normal;
      }
      td.n,
      th.n {
        font-family: var(--font-mono);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .code {
        font-family: var(--font-mono);
        color: var(--accent);
        overflow-wrap: anywhere;
      }
      canvas.qr {
        width: 132px;
        height: 132px;
        image-rendering: pixelated;
        border-radius: 6px;
      }
      .won {
        color: var(--good);
      }
      .lost {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <a class="portal-link" href="index.html">← All games</a>
    <main>
      <h1 data-title>Profile</h1>
      <div data-page></div>
    </main>

    <script src="lib/pwa.js"></script>
    <script src="lib/qr.js"></script>
    <script src="lib/stats.js"></script>
    <script src="lib/account.js"></script>
    <script src="lib/account-ui.js"></script>
    <script src="lib/catalog.js"></script>
    <script src="community/catalog.js"></script>
    <script src="lib/profile.js"></script>
  </body>
</html>
