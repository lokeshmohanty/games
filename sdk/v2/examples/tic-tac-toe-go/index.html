<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="tic-tac-toe.css" />
  </head>
  <body>
    <!-- Only your own files: the platform inlines sdk/v2/runtime.js first,
         and hands over tic-tac-toe.wasm (game.json "wasm") in init.
         wasm_exec.js and arcade-go.js are vendored by build.sh. -->
    <p id="hud" role="status"></p>
    <div id="ttt"></div>
    <script src="wasm_exec.js"></script>
    <script src="arcade-go.js"></script>
    <script src="tic-tac-toe.js"></script>
  </body>
</html>
