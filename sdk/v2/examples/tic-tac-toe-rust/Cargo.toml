[package]
name = "tic-tac-toe-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tic Tac Toe, the arcade's SDK v2 managed-state example in Rust (WebAssembly)."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The adapter: the Game trait and export!, which makes `dispatch`.
arcade = { path = "../../adapters/rust" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Not part of any outer workspace.
[workspace]
