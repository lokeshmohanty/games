# Simple workflow for deploying static content to GitHub Pages
name: Deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab. skip_tests
  # is for emergencies only (docs/development.md): it deploys without the
  # suites, building the site here as before the gate existed.
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Emergency only: deploy without running the test suites"
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Every suite (test.yml, the same workflow branches and pull requests run):
  # nothing deploys unless all of them pass, and what deploys is the very
  # site they passed against (its build job's `site` artifact). Read-only:
  # the test jobs never hold the Pages token.
  tests:
    if: ${{ !inputs.skip_tests }}
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # Outside repos' games (registry/), at their pinned commits, into
  # community/ with community/catalog.js and precache.js. Fails the deploy on
  # a bad pin rather than publishing a site without those games. A web app
  # (game.json "app") is built here, in a throwaway container — so this job
  # holds no token that can deploy: author code never runs beside one.
  # Only on the emergency path (skip_tests): otherwise test.yml's build job
  # has fetched them, under the same rules, into the site it tested.
  build-community:
    if: ${{ inputs.skip_tests }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      # The Python runtime web apps' servers run on, served from this site.
      - name: Fetch Pyodide
        run: node scripts/vendor-pyodide.mjs
      # Each web app's build, kept per pinned commit (fetch-community.mjs,
      # NEON_APP_CACHE): only a new pin or new build tooling builds again.
      # A pull request reads main's entries; what it builds stays its own.
      - name: Restore web app builds
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/app-cache
          key: apps-${{ hashFiles('registry/**/*.json', 'scripts/app-build.mjs', 'scripts/py-deps.py', 'sdk/pyodide/pyodide-lock.json') }}
          restore-keys: apps-
      # Community preview gifs get poster + video twins (preview-media.mjs).
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Fetch and build community games
        env:
          NEON_APP_CACHE: ${{ runner.temp }}/app-cache
        run: node scripts/fetch-community.mjs
      - name: Keep what the deploy adds to the site
        uses: actions/upload-artifact@v7
        with:
          name: generated
          path: |
            community/
            sdk/pyodide/
          include-hidden-files: false
          retention-days: 1

  deploy:
    needs: [tests, build-community]
    # The tests passed; or, on the emergency path, they were skipped and the
    # community games were fetched here instead.
    if: ${{ !cancelled() && (needs.tests.result == 'success' || (inputs.skip_tests && needs.tests.result == 'skipped' && needs.build-community.result == 'success')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # The site every suite just passed against, as test.yml built it
      # (Pyodide, the community games, pnpm build): deployed as it is.
      - name: The tested site
        if: ${{ !inputs.skip_tests }}
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      # The emergency path builds the site here, as before the gate.
      - name: Checkout
        if: ${{ inputs.skip_tests }}
        uses: actions/checkout@v7
      - name: Generated files
        if: ${{ inputs.skip_tests }}
        uses: actions/download-artifact@v8
        with:
          name: generated
          path: .
      # The offline snapshot's VERSION, rehashed over the community games too:
      # a new pin is a new deploy for every installed copy (sw.js).
      # The shell is one page built by Vite (docs/spa.md): pnpm build runs the
      # type check, vite build, and scripts/assemble.mjs, which copies what is
      # served as-is (games, sdk, lib, assets, the community games fetched
      # above) beside it and writes sw.js with a VERSION over exactly that.
      - name: Setup Node
        if: ${{ inputs.skip_tests }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm
        if: ${{ inputs.skip_tests }}
        run: npm install -g pnpm@12.9.0
      - name: Install the shell's dependencies
        if: ${{ inputs.skip_tests }}
        run: pnpm install --frozen-lockfile
      - name: Build the site
        if: ${{ inputs.skip_tests }}
        env:
          CHROME: /usr/bin/google-chrome # prebuild-frames.mjs
        run: pnpm build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # The built site (pnpm build), not the repository.
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
