# Simple workflow for deploying static content to GitHub Pages
name: Deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Outside repos' games (registry/), at their pinned commits, into
  # community/ with community/catalog.js and precache.js. Fails the deploy on
  # a bad pin rather than publishing a site without those games. A web app
  # (game.json "app") is built here, in a throwaway container — so this job
  # holds no token that can deploy: author code never runs beside one.
  build-community:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      # The Python runtime web apps' servers run on, served from this site.
      - name: Fetch Pyodide
        run: node scripts/vendor-pyodide.mjs
      # Each web app's build, kept per pinned commit (fetch-community.mjs,
      # NEON_APP_CACHE): only a new pin or new build tooling builds again.
      # A pull request reads main's entries; what it builds stays its own.
      - name: Restore web app builds
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/app-cache
          key: apps-${{ hashFiles('registry/**/*.json', 'scripts/app-build.mjs', 'scripts/py-deps.py', 'sdk/v1/pyodide/pyodide-lock.json') }}
          restore-keys: apps-
      # Community preview gifs get poster + video twins (preview-media.mjs).
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Fetch and build community games
        env:
          NEON_APP_CACHE: ${{ runner.temp }}/app-cache
        run: node scripts/fetch-community.mjs
      - name: Keep what the deploy adds to the site
        uses: actions/upload-artifact@v7
        with:
          name: generated
          path: |
            community/
            sdk/v1/pyodide/
          include-hidden-files: false
          retention-days: 1

  deploy:
    needs: build-community
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Generated files
        uses: actions/download-artifact@v8
        with:
          name: generated
          path: .
      # The offline snapshot's VERSION, rehashed over the community games too:
      # a new pin is a new deploy for every installed copy (sw.js).
      - name: Version the offline copy
        run: node scripts/sw-version.mjs --with-community
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
