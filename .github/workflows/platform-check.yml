# The check for changes to the arcade itself — the SDK, the runtime, this
# repo's games and the scripts that check games — re-validating every game
# against them. A contributor's game submission (registry/) has its own
# check: submission.yml. No secrets, no write access.
name: Check the platform

on:
  pull_request:
    paths:
      - "games/**"
      - "sdk/**"
      - "lib/**"
      - "scripts/manifest.mjs"
      - "scripts/fetch-community.mjs"
      - "scripts/validate-game.mjs"
      - "scripts/app-build.mjs"
      - "scripts/py-deps.py"
      - "scripts/vendor-pyodide.mjs"

permissions:
  contents: read

jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch Pyodide (web apps' servers)
        run: node scripts/vendor-pyodide.mjs
      - name: Fetch every pinned repo
        run: node scripts/fetch-community.mjs
      - name: Catalog is up to date
        run: node scripts/build-catalog.mjs --check
      - name: Install Playwright (driver only; the runner's Chrome is used)
        run: npm install --no-save playwright@1.62.1
      - name: Validate every game
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          dirs="sdk/v1/example/tic-tac-toe $(ls -d games/*/)"
          for pin in community/*/*/pin.json; do
            [ -e "$pin" ] || continue
            base=$(dirname "$pin")
            for g in $(node -e 'console.log(require("./"+process.argv[1]).games.join(" "))' "$pin"); do
              dirs="$dirs $base/$g"
            done
          done
          node scripts/validate-game.mjs $dirs | tee -a "$GITHUB_STEP_SUMMARY"
