# Keep the registry's pins current — through pull requests, never by hand
# (Lokesh, 2026-11-13: "send a PR, merge and then auto update").
#
# For every registered repo whose default branch is past its pin, this opens
# (or refreshes) a pull request that changes only `commit`, fetches the new
# commit, and runs the same checks a contributor's PR gets (validate-game:
# manifest, bundle and no-network rules, theme colours, 5 MB, then each game
# mounted with bots at 390x844). The result goes in the PR.
#
# Owners in registry/trusted.txt: a passing PR is merged and the site
# deployed. Everyone else: the PR waits for a maintainer to read and merge it.
#
# (A pull request opened with GITHUB_TOKEN does not start other workflows,
# which is why the checks run here, and why the deploy is started by name.)
name: Bump registry pins

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Only this owner/repo (default: all)"
        required: false
  # A contributor's repo may ask for a bump at once (needs a token there).
  repository_dispatch:
    types: [registry-bump]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: registry-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Which repos moved
        id: moved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ github.event.inputs.repo || github.event.client_payload.repo || '' }}
        run: |
          if [ -n "$ONLY" ]; then list=$(node scripts/registry-bump.mjs --only "$ONLY"); else list=$(node scripts/registry-bump.mjs); fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "moved: $list"
      - name: Install Playwright (driver only; the runner's Chrome is used)
        if: steps.moved.outputs.list != '[]'
        run: npm install --no-save playwright@1.62.1
      - name: A pull request per moved repo
        if: steps.moved.outputs.list != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME: /usr/bin/google-chrome
          LIST: ${{ steps.moved.outputs.list }}
        run: |
          git config user.name "arcade-registry[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$LIST" | node -e 'for (const b of JSON.parse(require("fs").readFileSync(0,"utf8"))) console.log([b.file,b.repo,b.from,b.to].join(" "))' |
          while read -r file repo from to; do
            branch="registry/bump-${repo//\//-}"
            git checkout -q -B "$branch" origin/main
            node scripts/registry-bump.mjs --apply "$file" "$to"
            git add "$file"
            git commit -q -m "registry: bump $repo to ${to:0:7}"
            git push -q -f origin "$branch"

            # The checks, on exactly what would be served.
            dirs=""
            if node scripts/fetch-community.mjs > fetch.log 2>&1; then
              owner="${repo%%/*}"; name="${repo##*/}"
              for g in $(node -e 'console.log(require("./"+process.argv[1]).games.join(" "))' "$file"); do dirs="$dirs community/$owner/$name/$g"; done
              node scripts/validate-game.mjs $dirs > checks.log 2>&1 && ok=1 || ok=0
            else
              cp fetch.log checks.log; ok=0
            fi
            {
              echo "Pin bump for **$repo**: \`${from:0:7}\` → \`${to:0:7}\` ([compare](https://github.com/$repo/compare/$from...$to))."
              echo
              if [ "$ok" = 1 ]; then echo "✅ Checks passed (fetch + validate-game)."; else echo "❌ Checks failed — not merged."; fi
              echo
              echo '<details><summary>Check output</summary>'
              echo
              echo '```'
              tail -c 60000 checks.log
              echo '```'
              echo '</details>'
            } > body.md

            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
            if [ -z "$pr" ]; then
              gh pr create --head "$branch" --base main --title "registry: bump $repo to ${to:0:7}" --body-file body.md
              pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
            else
              gh pr edit "$pr" --title "registry: bump $repo to ${to:0:7}" --body-file body.md
            fi

            owner="${repo%%/*}"
            if [ "$ok" = 1 ] && grep -qx "$owner" registry/trusted.txt; then
              gh pr merge "$pr" --squash --delete-branch
              gh workflow run deploy.yml --ref main
              echo "merged #$pr and started the deploy"
            else
              echo "left #$pr open for review"
            fi
            git checkout -q main 2>/dev/null || git checkout -q -B main origin/main
            git fetch -q origin main
          done
