<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Neon Survival Co-op — P2P</title>
    <link rel="stylesheet" href="lib/styles.css" />
    <style>
      #game {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #ui {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        z-index: 5;
        font-size: 0.9rem;
      }
      #ui .stat {
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      #score {
        color: var(--accent);
        font-weight: bold;
        text-shadow: 0 0 8px var(--accent-glow);
      }
      #alive {
        color: var(--good);
        text-shadow: 0 0 8px rgba(77, 255, 77, 0.4);
      }
      #me-color {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: inline-block;
        vertical-align: middle;
        margin-left: 8px;
        box-shadow: 0 0 8px currentColor;
      }
      #gameCanvas {
        border: 2px solid var(--border);
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
        touch-action: none;
        max-width: 95vw;
        max-height: 80vh;
      }
      .ghost-msg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--muted);
        font-size: 1.5rem;
        text-align: center;
        pointer-events: none;
        z-index: 4;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="lobby"></div>
    <div id="game" hidden>
      <div id="ui">
        <div class="stat"><span id="score">Score: 0</span></div>
        <div class="stat"><span id="alive">Alive: 1</span></div>
        <div class="stat">You<span id="me-color"></span></div>
      </div>
      <canvas id="gameCanvas"></canvas>
    </div>
    <div id="overlay" class="overlay" hidden></div>

    <script src="lib/net.js"></script>
    <script src="lib/lobby.js"></script>
    <script>
      const { mountLobby } = window.NeonArcade;

      // ── Config �─────────────────────────────────────────────
      const PALETTE = [
        "#0ff",
        "#f0f",
        "#4dff4d",
        "#ffd24d",
        "#ff4d4d",
        "#a0f",
        "#ff8c00",
        "#00ffaa",
      ];
      const POS_INTERVAL = 50; // ms — broadcast position every 50ms (~20Hz)
      const STATE_INTERVAL = 80; // ms — host broadcasts world state (~12Hz)
      const SPAWN_INTERVAL_INIT = 1000; // ms — initial enemy spawn rate
      const SPAWN_INTERVAL_MIN = 300; // ms — fastest spawn rate
      const MAX_GEMS = 3;
      const PLAYER_SIZE = 15;
      const ENEMY_SIZE = 8;
      const GEM_SIZE = 5;

      // �─ DOM ──────────────────────────────────────────────────
      const lobbyEl = document.getElementById("lobby");
      const gameEl = document.getElementById("game");
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const aliveEl = document.getElementById("alive");
      const meColorEl = document.getElementById("me-color");
      const overlayEl = document.getElementById("overlay");

      // ── State �───────────────────────────────────────────────
      let room = null;
      let myColor = "#0ff";
      let player = { x: 0, y: 0, alive: true, id: null };
      let peers = {}; // peerId -> { x, y, color, alive }
      let enemies = []; // host-authoritative
      let gems = []; // host-authoritative
      let particles = [];
      let score = 0;
      let aliveCount = 1;
      let gameActive = false;
      let lastPosSend = 0;
      let lastStateSend = 0;
      let lastSpawn = 0;
      let spawnRate = SPAWN_INTERVAL_INIT;
      let ghostMsgEl = null;

      function colorFor(id) {
        let h = 0;
        for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
        return PALETTE[h % PALETTE.length];
      }

      function resize() {
        const w = Math.min(window.innerWidth - 24, 800);
        const h = Math.min(window.innerHeight - 100, 600);
        canvas.width = w;
        canvas.height = h;
        if (!gameActive) {
          player.x = canvas.width / 2;
          player.y = canvas.height / 2;
        }
      }
      window.addEventListener("resize", resize);

      function handleInput(clientX, clientY) {
        if (!gameActive || !player.alive) return;
        const rect = canvas.getBoundingClientRect();
        player.x = clientX - rect.left;
        player.y = clientY - rect.top;
      }

      window.addEventListener("mousemove", (e) =>
        handleInput(e.clientX, e.clientY),
      );
      window.addEventListener(
        "touchstart",
        (e) => {
          if (!gameActive) return;
          handleInput(e.touches[0].clientX, e.touches[0].clientY);
          e.preventDefault();
        },
        { passive: false },
      );
      window.addEventListener(
        "touchmove",
        (e) => {
          if (!gameActive) return;
          handleInput(e.touches[0].clientX, e.touches[0].clientY);
          e.preventDefault();
        },
        { passive: false },
      );

      // ── Game logic (host) ────────────────────────────────────
      function spawnEnemy() {
        const side = Math.floor(Math.random() * 4);
        let x, y;
        if (side === 0) {
          x = Math.random() * canvas.width;
          y = -20;
        } else if (side === 1) {
          x = canvas.width + 20;
          y = Math.random() * canvas.height;
        } else if (side === 2) {
          x = Math.random() * canvas.width;
          y = canvas.height + 20;
        } else {
          x = -20;
          y = Math.random() * canvas.height;
        }

        // Home toward nearest alive player
        const alivePlayers = [
          { x: player.x, y: player.y },
          ...Object.values(peers).filter((p) => p.alive),
        ];
        if (alivePlayers.length === 0) return;
        const target =
          alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
        const angle = Math.atan2(target.y - y, target.x - x);
        const speed = 1.5 + score / 15;
        enemies.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: ENEMY_SIZE,
        });
      }

      function spawnGem() {
        gems.push({
          x: Math.random() * (canvas.width - 20) + 10,
          y: Math.random() * (canvas.height - 20) + 10,
          size: GEM_SIZE,
        });
      }

      function createParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 1,
            color,
          });
        }
      }

      function updateHost(time) {
        // Spawn enemies
        if (time - lastSpawn > spawnRate) {
          spawnEnemy();
          lastSpawn = time;
          spawnRate = Math.max(
            SPAWN_INTERVAL_MIN,
            SPAWN_INTERVAL_INIT - score * 10,
          );
        }
        // Random gems
        if (gems.length < MAX_GEMS && Math.random() < 0.02) spawnGem();

        // Move enemies
        for (const e of enemies) {
          e.x += e.vx;
          e.y += e.vy;
        }
        // Cull off-screen enemies (far gone)
        enemies = enemies.filter(
          (e) =>
            e.x > -100 &&
            e.x < canvas.width + 100 &&
            e.y > -100 &&
            e.y < canvas.height + 100,
        );
      }

      function checkCollisions() {
        if (!player.alive) return;
        // Enemy collision (local detection for own player)
        for (const e of enemies) {
          if (
            Math.hypot(player.x - e.x, player.y - e.y) <
            PLAYER_SIZE / 2 + e.size
          ) {
            player.alive = false;
            createParticles(player.x, player.y, myColor);
            room.makeAction("down").send({}, { target: room.hostId() });
            showGhostMsg("You're down! Spectating…");
            break;
          }
        }
        // Gem collision (local detection, host validates)
        for (let i = gems.length - 1; i >= 0; i--) {
          const g = gems[i];
          if (
            Math.hypot(player.x - g.x, player.y - g.y) <
            PLAYER_SIZE / 2 + g.size
          ) {
            createParticles(g.x, g.y, "#4dff4d");
            if (room.isHost()) {
              collectGem(i);
            } else {
              room
                .makeAction("collect")
                .send({ x: g.x, y: g.y }, { target: room.hostId() });
            }
          }
        }
      }

      function collectGem(index) {
        // host-only: validate and remove
        if (index >= 0 && index < gems.length) {
          gems.splice(index, 1);
          score++;
          scoreEl.textContent = "Score: " + score;
          broadcastState();
        }
      }

      function findGemIndex(x, y) {
        return gems.findIndex((g) => Math.hypot(g.x - x, g.y - y) < 20);
      }

      // ── Networking ───────────────────────────────────────────
      function broadcastPos() {
        if (!room) return;
        room.makeAction("pos").send({
          x: player.x,
          y: player.y,
          color: myColor,
          alive: player.alive,
        });
      }

      function broadcastState() {
        if (!room || !room.isHost()) return;
        const alivePeers =
          (player.alive ? 1 : 0) +
          Object.values(peers).filter((p) => p.alive).length;
        aliveCount = alivePeers;
        aliveEl.textContent = "Alive: " + aliveCount;
        room.makeAction("state").send({
          enemies: enemies.map((e) => ({
            x: e.x,
            y: e.y,
            vx: e.vx,
            vy: e.vy,
            size: e.size,
          })),
          gems: gems.map((g) => ({ x: g.x, y: g.y, size: g.size })),
          score,
          aliveCount,
        });
      }

      function showGhostMsg(text) {
        if (ghostMsgEl) ghostMsgEl.remove();
        ghostMsgEl = document.createElement("div");
        ghostMsgEl.className = "ghost-msg";
        ghostMsgEl.textContent = text;
        gameEl.append(ghostMsgEl);
      }

      function removeGhostMsg() {
        if (ghostMsgEl) {
          ghostMsgEl.remove();
          ghostMsgEl = null;
        }
      }

      function showOverlay(title, btnText, btnCb, sub) {
        overlayEl.replaceChildren();
        const h1 = document.createElement("h1");
        h1.textContent = title;
        overlayEl.append(h1);
        if (sub) {
          const p = document.createElement("p");
          p.textContent = sub;
          overlayEl.append(p);
        }
        if (btnText) {
          const btn = document.createElement("button");
          btn.className = "neon-btn";
          btn.textContent = btnText;
          btn.onclick = btnCb;
          overlayEl.append(btn);
        }
        overlayEl.hidden = false;
      }

      function hideOverlay() {
        overlayEl.hidden = true;
      }

      function resetGame() {
        player = {
          x: canvas.width / 2,
          y: canvas.height / 2,
          alive: true,
          id: room ? room.selfId : null,
        };
        enemies = [];
        gems = [];
        particles = [];
        score = 0;
        aliveCount = 1 + (room ? room.peerCount() : 0);
        spawnRate = SPAWN_INTERVAL_INIT;
        lastSpawn = 0;
        scoreEl.textContent = "Score: 0";
        aliveEl.textContent = "Alive: " + aliveCount;
        removeGhostMsg();
      }

      function startGame() {
        resetGame();
        gameActive = true;
        hideOverlay();
        if (room && room.isHost()) {
          // host initializes the world
          for (let i = 0; i < 2; i++) spawnGem();
          broadcastState();
        }
        requestAnimationFrame(loop);
      }

      function gameOver() {
        gameActive = false;
        if (room && room.isHost()) {
          showOverlay(
            "GAME OVER",
            "PLAY AGAIN",
            () => {
              room.makeAction("restart").send({});
              startGame();
            },
            "Final Score: " + score,
          );
        } else {
          showOverlay("GAME OVER", null, null, "Final Score: " + score);
          const p = document.createElement("p");
          p.textContent = "Waiting for host…";
          overlayEl.append(p);
        }
      }

      // ── Render �──────────────────────────────────────────────
      function draw() {
        // Motion trail fade
        ctx.fillStyle = "rgba(10, 10, 10, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Gems (host-authoritative state, but everyone renders from state)
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#4dff4d";
        ctx.fillStyle = "#4dff4d";
        for (const g of gems) {
          ctx.beginPath();
          ctx.arc(g.x, g.y, g.size, 0, Math.PI * 2);
          ctx.fill();
        }

        // Enemies
        ctx.shadowColor = "#ff4d4d";
        ctx.fillStyle = "#ff4d4d";
        for (const e of enemies) {
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
          ctx.fill();
        }

        // Peers (interpolated)
        for (const [id, p] of Object.entries(peers)) {
          if (p.x == null) continue;
          const alpha = p.alive ? 1 : 0.3;
          ctx.globalAlpha = alpha;
          ctx.shadowBlur = 15;
          ctx.shadowColor = p.color;
          ctx.fillStyle = p.color;
          ctx.fillRect(
            p.x - PLAYER_SIZE / 2,
            p.y - PLAYER_SIZE / 2,
            PLAYER_SIZE,
            PLAYER_SIZE,
          );
          ctx.globalAlpha = 1;
        }

        // Self
        if (player.alive) {
          ctx.shadowBlur = 15;
          ctx.shadowColor = myColor;
          ctx.fillStyle = myColor;
          ctx.fillRect(
            player.x - PLAYER_SIZE / 2,
            player.y - PLAYER_SIZE / 2,
            PLAYER_SIZE,
            PLAYER_SIZE,
          );
        } else {
          // ghost: dim outline
          ctx.globalAlpha = 0.3;
          ctx.shadowBlur = 5;
          ctx.shadowColor = myColor;
          ctx.strokeStyle = myColor;
          ctx.lineWidth = 1;
          ctx.strokeRect(
            player.x - PLAYER_SIZE / 2,
            player.y - PLAYER_SIZE / 2,
            PLAYER_SIZE,
            PLAYER_SIZE,
          );
          ctx.globalAlpha = 1;
        }

        // Particles (cosmetic, client-side)
        for (const p of particles) {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, 2, 2);
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }

      function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.02;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      function interpolatePeers() {
        // Snap-render peers at their last-known position (no extrapolation).
        // Light smoothing could lerp toward target; keep simple for now.
      }

      // ── Main loop ────────────────────────────────────────────
      function loop(time) {
        if (!gameActive) return;

        if (room && room.isHost()) {
          updateHost(time);
        }
        checkCollisions();
        updateParticles();
        draw();

        // Broadcast position at ~20Hz
        if (time - lastPosSend > POS_INTERVAL) {
          broadcastPos();
          lastPosSend = time;
        }
        // Host broadcasts state at ~12Hz
        if (room && room.isHost() && time - lastStateSend > STATE_INTERVAL) {
          broadcastState();
          lastStateSend = time;
          if (aliveCount === 0) {
            room.makeAction("gameover").send({});
            gameOver();
          }
        }

        requestAnimationFrame(loop);
      }

      // ── Lobby + networking setup ─────────────────────────────
      mountLobby(lobbyEl, {
        appId: "neon-survival-mp",
        gameName: "NEON SURVIVAL CO-OP",
        onReady(r) {
          room = r;
          myColor = colorFor(room.selfId);
          player.id = room.selfId;
          meColorEl.style.color = myColor;
          meColorEl.style.background = myColor;
          resize();

          const posAction = room.makeAction("pos");
          const stateAction = room.makeAction("state");
          const collectAction = room.makeAction("collect");
          const downAction = room.makeAction("down");
          const gameoverAction = room.makeAction("gameover");
          const restartAction = room.makeAction("restart");

          posAction.onMessage = (data, { peerId }) => {
            peers[peerId] = { ...data, id: peerId };
          };

          stateAction.onMessage = (data) => {
            if (room.isHost()) return; // host already has this state
            enemies = data.enemies || [];
            gems = data.gems || [];
            score = data.score;
            aliveCount = data.aliveCount;
            scoreEl.textContent = "Score: " + score;
            aliveEl.textContent = "Alive: " + aliveCount;
          };

          collectAction.onMessage = (data, { peerId }) => {
            if (!room.isHost()) return;
            const idx = findGemIndex(data.x, data.y);
            if (idx >= 0) {
              collectGem(idx);
            }
          };

          downAction.onMessage = (data, { peerId }) => {
            if (!room.isHost()) return;
            if (peers[peerId]) peers[peerId].alive = false;
            const alivePeers = Object.values(peers).filter(
              (p) => p.alive,
            ).length;
            aliveCount = alivePeers + (player.alive ? 1 : 0);
            aliveEl.textContent = "Alive: " + aliveCount;
            broadcastState();
            if (aliveCount === 0) {
              gameoverAction.send({});
              gameOver();
            }
          };

          gameoverAction.onMessage = () => {
            if (!room.isHost()) gameOver();
          };

          restartAction.onMessage = () => {
            startGame();
          };

          room; // referenced for clarity
        },
        onPeerJoin(peerId) {
          peers[peerId] = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            color: colorFor(peerId),
            alive: true,
          };
          aliveCount =
            (player.alive ? 1 : 0) +
            Object.values(peers).filter((p) => p.alive).length;
          aliveEl.textContent = "Alive: " + aliveCount;
          if (room.isHost() && gameActive) {
            // send current state to late joiner
            broadcastState();
          }
        },
        onPeerLeave(peerId) {
          delete peers[peerId];
          aliveCount =
            (player.alive ? 1 : 0) +
            Object.values(peers).filter((p) => p.alive).length;
          aliveEl.textContent = "Alive: " + aliveCount;
          if (room.isHost()) {
            broadcastState();
            if (aliveCount === 0 && gameActive) {
              room.makeAction("gameover").send({});
              gameOver();
            }
          }
        },
        onStart() {
          gameEl.hidden = false;
          resize();
          startGame();
        },
      });
    </script>
  </body>
</html>
