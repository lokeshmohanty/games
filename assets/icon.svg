<!--
  The app mark, "linked players": two joysticks, one per player, joined by one
  cable. Every game here is multiplayer, and that is the whole idea.
  Colours are the Paper theme's dark mode (lib/theme.css) written as hex, since
  an installed icon is a fixed picture and cannot follow the theme: slate tile,
  player 1 in the accent, player 2 in accent-2, the cable in ink. The portal
  header draws the same glyph with live tokens instead (index.html, .brand).
  Authored here and rendered to PNG by scripts/make-icons.mjs, so the installed
  icons and the favicon are the one drawing rather than four that drifted apart.

  Safe sizing: the glyph sits inside the middle 60% so the maskable variant
  survives Android cropping it to a circle. See make-icons.mjs.

  No double hyphen anywhere in this comment: XML forbids it, and a browser then
  refuses the whole file as a favicon (it did, 2026-08-16 to 2026-11-14).
  scripts/test-pwa.mjs parses this file as XML to keep it that way.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The tile itself. Dropped from the maskable variant, where the launcher
       supplies the shape and a second rounded rect inside it reads as a box
       drawn on a box. make-icons.mjs reads its fill as the backing colour. -->
  <g class="tile">
    <rect width="512" height="512" rx="112" fill="#111419" />
    <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#23272c" stroke-width="4" />
  </g>

  <g transform="translate(0 9)">
    <!-- the cable, drawn first so the balls cover its ends -->
    <path d="M168 176 C168 100 344 100 344 176" fill="none" stroke="#e1e5ea"
          stroke-width="16" stroke-linecap="round" />
    <!-- bases -->
    <rect x="104" y="332" width="128" height="44" rx="22" fill="#7b8189" />
    <rect x="280" y="332" width="128" height="44" rx="22" fill="#7b8189" />
    <!-- shafts -->
    <path d="M168 334 V250" stroke="#70b3f7" stroke-width="22" stroke-linecap="round" />
    <path d="M344 334 V250" stroke="#b0a4f8" stroke-width="22" stroke-linecap="round" />
    <!-- ball tops: player 1, player 2 -->
    <circle cx="168" cy="214" r="44" fill="#70b3f7" />
    <circle cx="344" cy="214" r="44" fill="#b0a4f8" />
  </g>
</svg>
