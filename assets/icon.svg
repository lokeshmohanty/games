<!--
  The app mark: an arcade joystick in the portal's cyan, glowing against the
  same near-black the pages use. Authored here and rendered to PNG by
  scripts/make-icons.mjs, so the installed icons and the favicon are the one
  drawing rather than four that drifted apart.

  `--safe` sizing: the glyph sits inside the middle 60% so the maskable variant
  survives Android cropping it to a circle. See make-icons.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ffcff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
  </defs>

  <!-- The tile itself. Dropped from the maskable variant, where the launcher
       supplies the shape and a second rounded rect inside it reads as a box
       drawn on a box. -->
  <g class="tile">
    <rect width="512" height="512" rx="112" fill="#0a0a0a" />
    <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#123" stroke-width="4" />
  </g>

  <g filter="url(#glow)" fill="none" stroke="#00e5ff" stroke-width="22"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- base -->
    <path d="M150 372 h212 a26 26 0 0 0 25-33 l-14-52 h-234 l-14 52 a26 26 0 0 0 25 33 z" />
    <!-- shaft -->
    <path d="M256 287 v-52" />
  </g>
  <!-- ball top -->
  <circle cx="256" cy="182" r="54" fill="url(#ball)" filter="url(#glow)" />
  <!-- two buttons, the way every cabinet has them -->
  <circle cx="196" cy="330" r="17" fill="#0a0a0a" />
  <circle cx="316" cy="330" r="17" fill="#0a0a0a" />
</svg>
