<!--
  Shown in place of a preview gif that will not load. It used to be a
  via.placeholder.com URL, which was the only third-party server this project
  ever contacted — and, being a fallback for a *missing* image, it was reached
  for at exactly the moments the network was least likely to be there. A local
  file cannot fail that way, and offline it still draws.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200"
     role="img" aria-label="Preview unavailable">
  <rect width="300" height="200" fill="#1a1a1a" />
  <g fill="none" stroke="#0ff" stroke-opacity="0.5" stroke-width="2">
    <rect x="8" y="8" width="284" height="184" rx="8" stroke-dasharray="10 8" />
    <circle cx="150" cy="88" r="26" />
    <path d="M150 62 v-14" stroke-linecap="round" />
    <path d="M124 114 h52" stroke-linecap="round" />
  </g>
  <text x="150" y="150" text-anchor="middle" fill="#0ff" fill-opacity="0.65"
        font-family="Segoe UI, Tahoma, Verdana, sans-serif" font-size="14"
        letter-spacing="2">NO PREVIEW</text>
</svg>
