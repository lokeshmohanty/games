<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Draw & Guess — P2P</title>
    <link rel="stylesheet" href="lib/styles.css" />
    <style>
      #game {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        /* Top padding clears the fixed "all games" pill; the canvas is flex:1
           so it simply takes the remaining height. */
        padding: 52px 8px 8px;
        gap: 8px;
        box-sizing: border-box;
      }
      #hud {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        justify-content: space-between;
        font-size: 0.85rem;
        min-height: 2.5em;
      }
      #hud .info {
        color: var(--accent);
        text-shadow: 0 0 6px var(--accent-glow);
      }
      #hud .scores {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      #hud .score-pill {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 2px 12px;
        font-size: 0.8rem;
      }
      #hud .score-pill.me {
        border-color: var(--accent);
        box-shadow: 0 0 8px var(--accent-glow);
      }
      #hud .timer {
        font-size: 1.1rem;
        font-weight: bold;
        color: var(--accent2);
        text-shadow: 0 0 8px rgba(255, 0, 255, 0.4);
      }
      #word-display {
        text-align: center;
        font-size: clamp(1.2rem, 4vw, 1.8rem);
        letter-spacing: 4px;
        color: var(--accent);
        text-shadow: 0 0 10px var(--accent-glow);
        min-height: 1.5em;
        font-weight: bold;
      }
      #canvas-wrap {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 0;
      }
      #board {
        border: 2px solid var(--accent);
        border-radius: 8px;
        box-shadow: 0 0 20px var(--accent-glow);
        background: #111;
        touch-action: none;
        max-width: 100%;
        max-height: 100%;
      }
      #tools {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        min-height: 2em;
      }
      .swatch {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: transform 0.1s;
      }
      .swatch.active {
        border-color: #fff;
        transform: scale(1.15);
      }
      .size-btn {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid var(--border);
        background: var(--panel);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .size-btn.active {
        border-color: var(--accent);
      }
      .size-btn .dot {
        border-radius: 50%;
        background: #fff;
      }
      #clear-btn {
        font-size: 0.75rem;
        padding: 6px 12px;
      }
      #chat-area {
        height: 120px;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }
      #chat-log {
        flex: 1;
        overflow-y: auto;
        padding: 6px 10px;
        font-size: 0.85rem;
        line-height: 1.4;
      }
      #chat-log .line {
        margin: 2px 0;
        word-break: break-word;
      }
      #chat-log .line.correct {
        color: var(--good);
        font-weight: bold;
      }
      #chat-log .line.system {
        color: var(--accent2);
        font-style: italic;
      }
      #chat-log .line .name {
        color: var(--accent);
      }
      #chat-input-row {
        display: flex;
        gap: 6px;
        padding: 6px;
        border-top: 1px solid var(--border);
      }
      #chat-input {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: #fff;
        padding: 8px 12px;
        font-size: 0.9rem;
        font-family: var(--font);
      }
      #chat-input:focus {
        outline: none;
        border-color: var(--accent);
      }
      #chat-input:disabled {
        opacity: 0.5;
      }
      #chat-send {
        padding: 8px 16px;
      }
    </style>
  </head>
  <body>
    <a class="portal-link" href="index.html">&#8592; All games</a>
    <div id="lobby"></div>
    <div id="game" hidden>
      <div id="hud"></div>
      <div id="word-display"></div>
      <div id="canvas-wrap">
        <canvas id="board"></canvas>
      </div>
      <div id="tools"></div>
      <div id="chat-area">
        <div id="chat-log"></div>
        <div id="chat-input-row">
          <input
            id="chat-input"
            type="text"
            placeholder="Type your guess…"
            autocomplete="off"
            maxlength="60"
          />
          <button id="chat-send" class="neon-btn">SEND</button>
        </div>
      </div>
    </div>
    <div id="overlay" class="overlay" hidden></div>

    <script src="lib/qr.js"></script>
    <script src="lib/qr-decode.js"></script>
    <script src="lib/net.js"></script>
    <script src="lib/lobby.js"></script>
    <script>
      const { mountLobby } = window.NeonArcade;

      // �─ Config ──────────────────────────────────────────────
      const WORDS = [
        "cat",
        "dog",
        "house",
        "tree",
        "sun",
        "moon",
        "star",
        "fish",
        "bird",
        "boat",
        "car",
        "bike",
        "flower",
        "cloud",
        "mountain",
        "river",
        "pizza",
        "cake",
        "apple",
        "banana",
        "hat",
        "shoe",
        "book",
        "phone",
        "key",
        "door",
        "chair",
        "table",
        "lamp",
        "guitar",
        "drum",
        "robot",
        "rocket",
        "ghost",
        "skull",
        "heart",
        "eye",
        "hand",
        "umbrella",
        "clock",
        "bridge",
        "castle",
      ];
      const CANVAS_W = 600;
      const CANVAS_H = 400;
      const DRAW_TIME = 60; // seconds
      const REVEAL_TIME = 5; // seconds
      const ROUNDS_PER_PLAYER = 2; // each player draws this many times
      const PALETTE = ["#0ff", "#f0f", "#4dff4d", "#ffd24d", "#fff", "#ff4d4d"];
      const SIZES = [3, 6, 12];
      const SCORE_BASE = 100;
      const SCORE_TIME_BONUS = 2;
      const DRAWER_BONUS = 50;

      // ── DOM �─────────────────────────────────────────────────
      const lobbyEl = document.getElementById("lobby");
      const gameEl = document.getElementById("game");
      const hudEl = document.getElementById("hud");
      const wordEl = document.getElementById("word-display");
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const toolsEl = document.getElementById("tools");
      const chatLog = document.getElementById("chat-log");
      const chatInput = document.getElementById("chat-input");
      const chatSend = document.getElementById("chat-send");
      const overlayEl = document.getElementById("overlay");

      canvas.width = CANVAS_W;
      canvas.height = CANVAS_H;

      // ── State �───────────────────────────────────────────────
      let room = null;
      let scores = {}; // peerId -> number
      let names = {}; // peerId -> "Player N"
      let phase = "lobby"; // lobby | choosing | drawing | reveal | gameover
      let drawerId = null;
      let currentWord = "";
      let wordHint = "";
      let round = 0;
      let totalRounds = 0;
      let timeLeft = 0;
      let guessedIds = new Set();
      let myColor = "#0ff";
      let drawColor = PALETTE[0];
      let drawSize = SIZES[1];
      let drawing = false;
      let lastPt = null;
      let hostTimer = null;
      let strokeThrottle = 0;
      let pendingStrokes = [];

      // ── Helpers �─────────────────────────────────────────────
      function colorFor(id) {
        const PAL = [
          "#0ff",
          "#f0f",
          "#4dff4d",
          "#ffd24d",
          "#ff4d4d",
          "#a0f",
          "#ff8c00",
          "#00ffaa",
        ];
        let h = 0;
        for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
        return PAL[h % PAL.length];
      }

      function assignNames() {
        const all = [room.selfId, ...room.getPeers()].sort();
        totalRounds = all.length * ROUNDS_PER_PLAYER;
        all.forEach((id, i) => {
          names[id] = "Player " + (i + 1);
        });
      }

      function nameOf(id) {
        return names[id] || id.slice(0, 6);
      }

      function clearCanvas() {
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }

      function drawSegment(s) {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.size;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowBlur = 6;
        ctx.shadowColor = s.color;
        ctx.beginPath();
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(s.x1, s.y1);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function drawDot(x, y, color, size) {
        ctx.fillStyle = color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = color;
        ctx.beginPath();
        ctx.arc(x, y, size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function pointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        return {
          x: (cx / rect.width) * CANVAS_W,
          y: (cy / rect.height) * CANVAS_H,
        };
      }

      function flushStrokes() {
        if (pendingStrokes.length === 0) return;
        const action = room.makeAction("stroke");
        for (const s of pendingStrokes) action.send(s);
        pendingStrokes = [];
      }

      function setupDrawing() {
        const onDown = (e) => {
          if (phase !== "drawing" || drawerId !== room.selfId) return;
          e.preventDefault();
          drawing = true;
          lastPt = pointerPos(e);
          drawDot(lastPt.x, lastPt.y, drawColor, drawSize);
          pendingStrokes.push({
            x0: lastPt.x,
            y0: lastPt.y,
            x1: lastPt.x,
            y1: lastPt.y,
            color: drawColor,
            size: drawSize,
          });
        };
        const onMove = (e) => {
          if (!drawing) return;
          e.preventDefault();
          const pt = pointerPos(e);
          const seg = {
            x0: lastPt.x,
            y0: lastPt.y,
            x1: pt.x,
            y1: pt.y,
            color: drawColor,
            size: drawSize,
          };
          drawSegment(seg);
          pendingStrokes.push(seg);
          lastPt = pt;
          const now = performance.now();
          if (now - strokeThrottle > 33) {
            flushStrokes();
            strokeThrottle = now;
          }
        };
        const onUp = () => {
          if (!drawing) return;
          drawing = false;
          flushStrokes();
        };
        canvas.addEventListener("mousedown", onDown);
        canvas.addEventListener("mousemove", onMove);
        canvas.addEventListener("mouseup", onUp);
        canvas.addEventListener("mouseleave", onUp);
        canvas.addEventListener("touchstart", onDown, { passive: false });
        canvas.addEventListener("touchmove", onMove, { passive: false });
        canvas.addEventListener("touchend", onUp);
      }

      function setupTools() {
        toolsEl.replaceChildren();
        PALETTE.forEach((c) => {
          const sw = document.createElement("div");
          sw.className = "swatch" + (c === drawColor ? " active" : "");
          sw.style.background = c;
          sw.onclick = () => {
            drawColor = c;
            toolsEl
              .querySelectorAll(".swatch")
              .forEach((s) => s.classList.remove("active"));
            sw.classList.add("active");
          };
          toolsEl.append(sw);
        });
        const sep = document.createElement("span");
        sep.style.width = "1px";
        sep.style.height = "24px";
        sep.style.background = "var(--border)";
        toolsEl.append(sep);
        SIZES.forEach((s) => {
          const btn = document.createElement("div");
          btn.className = "size-btn" + (s === drawSize ? " active" : "");
          const dot = document.createElement("div");
          dot.className = "dot";
          dot.style.width = s + "px";
          dot.style.height = s + "px";
          btn.append(dot);
          btn.onclick = () => {
            drawSize = s;
            toolsEl
              .querySelectorAll(".size-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
          };
          toolsEl.append(btn);
        });
        const sep2 = document.createElement("span");
        sep2.style.width = "1px";
        sep2.style.height = "24px";
        sep2.style.background = "var(--border)";
        toolsEl.append(sep2);
        const clearBtn = document.createElement("button");
        clearBtn.className = "neon-btn";
        clearBtn.id = "clear-btn";
        clearBtn.textContent = "CLEAR";
        clearBtn.onclick = () => {
          if (phase === "drawing" && drawerId === room.selfId) {
            clearCanvas();
            room.makeAction("clear").send({});
          }
        };
        toolsEl.append(clearBtn);
      }

      function updateHud() {
        hudEl.replaceChildren();
        const info = document.createElement("div");
        info.className = "info";
        if (phase === "gameover") {
          info.textContent = "GAME OVER";
        } else if (
          phase === "choosing" ||
          phase === "drawing" ||
          phase === "reveal"
        ) {
          info.textContent = `Round ${Math.min(round + 1, totalRounds)} / ${totalRounds}`;
        } else {
          info.textContent = "";
        }
        const timerEl = document.createElement("div");
        timerEl.className = "timer";
        if (phase === "drawing" || phase === "reveal")
          timerEl.textContent = timeLeft + "s";
        const scoresEl = document.createElement("div");
        scoresEl.className = "scores";
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        for (const [id, sc] of sorted) {
          const pill = document.createElement("div");
          pill.className = "score-pill" + (id === room.selfId ? " me" : "");
          pill.textContent = `${nameOf(id)}: ${sc}`;
          scoresEl.append(pill);
        }
        hudEl.append(info, timerEl, scoresEl);
      }

      function updateWordDisplay() {
        if (phase === "drawing" && drawerId === room.selfId) {
          wordEl.textContent = currentWord.toUpperCase();
          wordEl.style.color = "var(--good)";
          wordEl.style.textShadow = "0 0 10px rgba(77,255,77,0.5)";
        } else if (phase === "drawing") {
          wordEl.textContent = wordHint;
          wordEl.style.color = "var(--accent)";
          wordEl.style.textShadow = "0 0 10px var(--accent-glow)";
        } else if (phase === "reveal" || phase === "gameover") {
          wordEl.textContent = currentWord ? currentWord.toUpperCase() : "";
          wordEl.style.color = "var(--accent2)";
          wordEl.style.textShadow = "0 0 10px rgba(255,0,255,0.5)";
        } else {
          wordEl.textContent = "";
        }
      }

      function updateInputState() {
        const canGuess =
          phase === "drawing" &&
          drawerId !== room.selfId &&
          !guessedIds.has(room.selfId);
        chatInput.disabled = !canGuess;
        chatInput.placeholder = canGuess
          ? "Type your guess…"
          : drawerId === room.selfId
            ? "You are drawing!"
            : guessedIds.has(room.selfId)
              ? "You guessed it! �"
              : "Waiting…";
        chatSend.disabled = !canGuess;
      }

      function addChatLine(name, text, kind) {
        const line = document.createElement("div");
        line.className = "line" + (kind ? " " + kind : "");
        if (kind === "correct") {
          line.textContent = `🎉 ${name} guessed it!`;
        } else if (kind === "system") {
          line.textContent = text;
        } else {
          const nameSpan = document.createElement("span");
          nameSpan.className = "name";
          nameSpan.textContent = name + ": ";
          line.append(nameSpan, document.createTextNode(text));
        }
        chatLog.append(line);
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      function showOverlay(title, btnText, btnCb, sub) {
        overlayEl.replaceChildren();
        const h1 = document.createElement("h1");
        h1.textContent = title;
        overlayEl.append(h1);
        if (sub) {
          const p = document.createElement("p");
          p.textContent = sub;
          overlayEl.append(p);
        }
        if (btnText) {
          const btn = document.createElement("button");
          btn.className = "neon-btn";
          btn.textContent = btnText;
          btn.onclick = btnCb;
          overlayEl.append(btn);
        }
        overlayEl.hidden = false;
      }

      function hideOverlay() {
        overlayEl.hidden = true;
      }

      // ── Host logic ───────────────────────────────────────────
      function broadcastState() {
        if (!room.isHost()) return;
        room.makeAction("state").send({
          phase,
          drawerId,
          wordHint,
          round,
          totalRounds,
          timeLeft,
          scores,
          guessedIds: [...guessedIds],
          gameOver: phase === "gameover",
        });
      }

      function pickDrawer() {
        const players = [room.selfId, ...room.getPeers()].sort();
        if (players.length === 0) return null;
        return players[round % players.length];
      }

      function startChoosing() {
        phase = "choosing";
        currentWord = WORDS[Math.floor(Math.random() * WORDS.length)];
        drawerId = pickDrawer();
        guessedIds = new Set();
        wordHint = "_".repeat(currentWord.length);
        timeLeft = 0;
        broadcastState();
        // send word to drawer only
        room
          .makeAction("word")
          .send({ word: currentWord }, { target: drawerId });
        // brief choosing pause then start drawing
        setTimeout(() => {
          if (phase !== "choosing") return;
          startDrawing();
        }, 2000);
      }

      function startDrawing() {
        phase = "drawing";
        timeLeft = DRAW_TIME;
        clearCanvasOnAll();
        broadcastState();
        updateWordDisplay();
        updateInputState();
        if (hostTimer) clearInterval(hostTimer);
        hostTimer = setInterval(() => {
          if (phase !== "drawing") return;
          timeLeft--;
          if (timeLeft % 5 === 0 || timeLeft <= 10) broadcastState();
          if (timeLeft <= 0) {
            clearInterval(hostTimer);
            hostTimer = null;
            startReveal();
          }
        }, 1000);
      }

      function clearCanvasOnAll() {
        // host tells everyone to clear (including self)
        clearCanvas();
        room.makeAction("clear").send({});
      }

      function startReveal() {
        phase = "reveal";
        timeLeft = REVEAL_TIME;
        broadcastState();
        // reveal the word to everyone (not just the drawer)
        room.makeAction("word").send({ word: currentWord });
        updateWordDisplay();
        updateInputState();
        if (hostTimer) clearInterval(hostTimer);
        hostTimer = setInterval(() => {
          if (phase !== "reveal") return;
          timeLeft--;
          if (timeLeft <= 0) {
            clearInterval(hostTimer);
            hostTimer = null;
            nextRound();
          }
        }, 1000);
      }

      function nextRound() {
        round++;
        const players = [room.selfId, ...room.getPeers()].sort();
        if (round >= totalRounds || players.length === 0) {
          phase = "gameover";
          broadcastState();
          updateHud();
          updateWordDisplay();
          if (room.isHost()) {
            showOverlay("GAME OVER", "PLAY AGAIN", restart, finalScoresText());
          } else {
            showOverlay("GAME OVER", null, null, finalScoresText());
            const p = document.createElement("p");
            p.textContent = "Waiting for host…";
            overlayEl.append(p, NeonArcade.hostNewGameButton());
          }
          return;
        }
        startChoosing();
      }

      function finalScoresText() {
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        if (sorted.length === 0) return "";
        const [winnerId, winnerScore] = sorted[0];
        return `${nameOf(winnerId)} wins with ${winnerScore} points!`;
      }

      function restart() {
        scores = {};
        round = 0;
        guessedIds = new Set();
        chatLog.replaceChildren();
        hideOverlay();
        startChoosing();
      }

      function handleGuess(text, peerId) {
        if (!room.isHost()) return;
        if (phase !== "drawing") return;
        if (peerId === drawerId) return;
        if (guessedIds.has(peerId)) return;
        const guess = text.trim().toLowerCase();
        if (!guess) return;
        if (guess === currentWord.toLowerCase()) {
          guessedIds.add(peerId);
          const bonus = timeLeft * SCORE_TIME_BONUS;
          scores[peerId] = (scores[peerId] || 0) + SCORE_BASE + bonus;
          scores[drawerId] = (scores[drawerId] || 0) + DRAWER_BONUS;
          room
            .makeAction("chat")
            .send({ peerId, name: nameOf(peerId), text: "", correct: true });
          addChatLine(nameOf(peerId), "", "correct");
          broadcastState();
          updateHud();
          // all guessers done?
          const guessers = [room.selfId, ...room.getPeers()].filter(
            (id) => id !== drawerId,
          );
          if (guessedIds.size >= guessers.length) {
            if (hostTimer) clearInterval(hostTimer);
            startReveal();
          }
        } else {
          room
            .makeAction("chat")
            .send({ peerId, name: nameOf(peerId), text, correct: false });
          addChatLine(nameOf(peerId), text, "");
        }
      }

      // �─ Networking ───────────────────────────────────────────
      mountLobby(lobbyEl, {
        gameName: "DRAW & GUESS",
        onReady(r) {
          room = r;
          myColor = colorFor(room.selfId);
          assignNames();
          setupTools();
          setupDrawing();
          clearCanvas();

          const stateAction = room.makeAction("state");
          const wordAction = room.makeAction("word");
          const strokeAction = room.makeAction("stroke");
          const clearAction = room.makeAction("clear");
          const guessAction = room.makeAction("guess");
          const chatAction = room.makeAction("chat");

          stateAction.onMessage = (data) => {
            const wasPhase = phase;
            phase = data.phase;
            drawerId = data.drawerId;
            wordHint = data.wordHint;
            round = data.round;
            totalRounds = data.totalRounds;
            timeLeft = data.timeLeft;
            scores = data.scores || {};
            guessedIds = new Set(data.guessedIds || []);
            if (phase === "gameover" && wasPhase !== "gameover") {
              // guest needs to show the game-over overlay (host shows it in nextRound)
              if (!room.isHost()) {
                showOverlay("GAME OVER", null, null, finalScoresText());
                const p = document.createElement("p");
                p.textContent = "Waiting for host…";
                overlayEl.append(p, NeonArcade.hostNewGameButton());
              }
              updateWordDisplay();
            } else if (phase === "reveal" || phase === "gameover") {
              // word revealed via word action in host flow; for non-host we set it on reveal
            }
            // hide overlay when host restarts (phase transitions away from gameover)
            if (phase !== "gameover" && wasPhase === "gameover") {
              hideOverlay();
            }
            updateHud();
            updateWordDisplay();
            updateInputState();
          };

          wordAction.onMessage = (data) => {
            currentWord = data.word;
            updateWordDisplay();
          };

          strokeAction.onMessage = (data) => {
            drawSegment(data);
          };

          clearAction.onMessage = () => {
            clearCanvas();
          };

          guessAction.onMessage = (data, { peerId }) => {
            handleGuess(data.text, peerId);
          };

          chatAction.onMessage = (data) => {
            if (data.correct) {
              addChatLine(data.name, "", "correct");
            } else {
              addChatLine(data.name, data.text, "");
            }
          };

          // Chat input
          const sendGuess = () => {
            const text = chatInput.value.trim();
            if (!text) return;
            chatInput.value = "";
            if (room.isHost()) {
              handleGuess(text, room.selfId);
            } else {
              guessAction.send({ text }, { target: room.hostId() });
            }
          };
          chatSend.onclick = sendGuess;
          chatInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendGuess();
          });
        },
        onPeerJoin(peerId) {
          if (room.isHost()) {
            assignNames();
            scores[peerId] = scores[peerId] || 0;
            // send current state to new peer
            broadcastState();
            // if in drawing/reveal, send the word to the drawer if it's them
            if (
              (phase === "drawing" ||
                phase === "reveal" ||
                phase === "choosing") &&
              peerId === drawerId
            ) {
              room
                .makeAction("word")
                .send({ word: currentWord }, { target: peerId });
            }
            addChatLine("", `${nameOf(peerId)} joined`, "system");
          }
          assignNames();
          updateHud();
        },
        onPeerLeave(peerId) {
          if (room.isHost()) {
            assignNames();
            addChatLine("", `${nameOf(peerId)} left`, "system");
            // if drawer left, skip to reveal
            if (peerId === drawerId && phase === "drawing") {
              if (hostTimer) clearInterval(hostTimer);
              startReveal();
            }
            broadcastState();
          }
          updateHud();
        },
        onStart() {
          gameEl.hidden = false;
          clearCanvas();
          if (room.isHost()) {
            scores = {};
            round = 0;
            guessedIds = new Set();
            chatLog.replaceChildren();
            startChoosing();
          }
          updateHud();
          updateWordDisplay();
          updateInputState();
        },
      });
    </script>
  </body>
</html>
