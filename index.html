<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade Games</title>
    <!-- Installable: manifest + icons, registered by lib/pwa.js. -->
    <link rel="manifest" href="manifest.webmanifest" vite-ignore />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" vite-ignore />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" vite-ignore />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Arcade Games" />
    <!-- The theme: tokens, fonts, and the saved choice before the first paint.
         Served as-is, not bundled (vite-ignore): game frames inline the same
         files (lib/bridge.js), so the service worker holds one copy. -->
    <link rel="stylesheet" href="lib/theme.css" vite-ignore />
    <script src="lib/theme.js" vite-ignore></script>
    <link rel="stylesheet" href="lib/styles.css" vite-ignore />
    <!-- The community catalog (src/main.tsx loads it once the bundle has run;
         the party mounts only after it): asked for now, beside the bundle,
         not after it. 404 in a checkout without `just community`, harmlessly. -->
    <link rel="preload" href="community/catalog.js" as="script" vite-ignore />
    <script>
      // The Games tab's two sub-tabs, My Games and All Games (docs/spa.md
      // "The portal's sub-tabs"). The home screen opens on My Games once this
      // device has a favourite or a recently played game, else on All Games.
      // Decided here, before the first paint, from localStorage (synchronous),
      // so the static first frame below already shows the right sub-tab; the
      // router (src/router.ts) asks the same function for every portal
      // address that names no sub-tab. The view test mirrors src/router.ts's.
      (() => {
        const A = (window.NeonArcade = window.NeonArcade || {});
        const count = (key) => {
          try {
            const v = JSON.parse(localStorage.getItem(key));
            return Array.isArray(v) ? v.length : 0;
          } catch {
            return 0;
          }
        };
        A.homeTab = () => (count("neon.favs") || count("neon.recent") ? "mine" : "all");
        const q = new URLSearchParams(location.search);
        const page = q.get("page");
        const other = (page !== null && page !== "games") || ["game", "mode", "fresh", "dev", "party"].some((k) => q.has(k)) || /[#&](i|c|a)=/.test(location.hash);
        if (other) return;
        const tab = q.get("tab");
        document.documentElement.dataset.home = tab === "mine" || tab === "all" ? tab : q.has("q") ? "all" : A.homeTab();
      })();
    </script>
  </head>
  <body>
    <!-- The views (src/App.tsx). Until the shell's code has run, the portal's
         first lines as plain HTML, so something paints as the page arrives
         (cold FCP 0.80 s without it, perf 2026-11-15); dropped at once when the
         address names another view, replaced when the app renders. -->
    <div id="app">
      <main class="view-portal boot">
        <!-- lib/nav.js's row as it will be drawn, so nothing moves when it is:
             the tabs, the ☰ button's place, and the Games sub-tabs, the one
             decided above lit (lib/styles.css). test-portal compares the two. -->
        <nav class="site-nav" aria-label="Arcade">
          <div class="site-row">
            <div class="site-tabs" role="list">
              <a class="site-tab is-on" role="listitem" href="./">Games</a>
              <a class="site-tab" role="listitem" href="./?page=collections">Community</a>
            </div>
            <div class="site-menu"><span class="site-menu-btn" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16" /></svg></span></div>
          </div>
          <div class="site-subtabs" role="list">
            <a class="site-subtab" role="listitem" data-tab="mine" href="./?page=games&amp;tab=mine">My Games</a>
            <a class="site-subtab" role="listitem" data-tab="all" href="./?page=games&amp;tab=all">All Games</a>
          </div>
        </nav>
        <h1 class="brand">
          <svg class="mark" viewBox="96 104 320 288" aria-hidden="true">
            <g transform="translate(0 9)" stroke-linecap="round">
              <path class="wire" d="M168 176 C168 100 344 100 344 176" stroke-width="16" />
              <rect class="base" x="104" y="332" width="128" height="44" rx="22" />
              <rect class="base" x="280" y="332" width="128" height="44" rx="22" />
              <path class="p1" d="M168 334 V250" stroke-width="22" />
              <path class="p2" d="M344 334 V250" stroke-width="22" />
              <circle class="p1" cx="168" cy="214" r="44" stroke-width="0" />
              <circle class="p2" cx="344" cy="214" r="44" stroke-width="0" />
            </g>
          </svg>
          <span>Arcade Games</span>
        </h1>
        <p class="tagline">
          Every game is multiplayer. Play the bots on this device, or send an invite and play the people. No accounts, no servers,
          nothing to sign up for.
        </p>
      </main>
    </div>
    <script>
      // Another view (the head's test): no portal heading flashing first.
      if (!document.documentElement.dataset.home) document.querySelector("#app .boot")?.remove();
    </script>
    <!-- The party: mounted once, kept across views (src/App.tsx). -->
    <div id="party-layer" hidden>
      <a class="portal-link" href="./"><span class="icon" aria-hidden="true">&#8592;</span> <span class="label">Games</span></a>
      <div id="party"></div>
      <div id="stage" hidden></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
