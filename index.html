<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade Portal</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
        color: #fff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      h1 {
        font-size: 3rem;
        color: #0ff;
        text-shadow: 0 0 20px #0ff;
        margin-bottom: 50px;
        text-transform: uppercase;
        letter-spacing: 5px;
      }
      .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
        width: 80%;
        max-width: 1200px;
      }
      .game-card {
        background: #1a1a1a;
        border: 2px solid #333;
        border-radius: 15px;
        overflow: hidden;
        transition: all 0.3s ease;
        cursor: pointer;
        text-align: center;
        position: relative;
      }
      .game-card:hover {
        border-color: #0ff;
        transform: translateY(-10px);
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
      }
      .game-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
        border-bottom: 2px solid #333;
      }
      .game-card h2 {
        margin: 20px 0;
        font-size: 1.5rem;
        color: #fff;
      }
      .game-card p {
        color: #aaa;
        margin: 0 20px 20px;
        font-size: 0.9rem;
      }
      .play-btn {
        display: inline-block;
        padding: 10px 25px;
        background: #0ff;
        color: #000;
        text-decoration: none;
        font-weight: bold;
        border-radius: 5px;
        margin-bottom: 20px;
        transition: transform 0.1s;
      }
      .game-card:hover .play-btn {
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <h1>Game Portal</h1>
    <div class="games-grid">
      <div
        class="game-card"
        onclick="window.location.href = 'neon-survival.html'"
      >
        <img
          src="assets/neon-survival.gif"
          alt="Neon Survival Preview"
          onerror="
            this.src =
              'https://via.placeholder.com/300x200/1a1a1a/0ff?text=Neon+Survival+Preview'
          "
        />
        <h2>Neon Survival</h2>
        <p>Dodge the red, collect the green. How long can you survive?</p>
        <a href="neon-survival.html" class="play-btn">PLAY NOW</a>
      </div>
    </div>
  </body>
</html>
