<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undercover — Arcade Games</title>
    <!--
      A shortcut into the party shell with Undercover picked (Lokesh, 2026-11-13:
      game pages are party shortcuts). It used to carry its own two-player
      lobby, with no join by code and no way back after a reload; the party
      shell has both, and every game is one code path now. This page stays so
      that links, bookmarks and home-screen shortcuts keep working: it
      redirects with `location.replace` (no back-button entry), keeping the
      query (a test's `?mockroom` or loopback `?rs=`) and any `#i=`/`#c=`
      link, which the party joins instead of starting fresh.
    -->
    <link rel="canonical" href="party.html?game=undercover" />
    <meta http-equiv="refresh" content="0; url=party.html?game=undercover&amp;fresh=1" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Arcade Games" />
    <!-- The theme first: tokens + fonts, and the saved choice before paint. -->
    <link rel="stylesheet" href="lib/theme.css" />
    <script src="lib/theme.js"></script>
    <link rel="stylesheet" href="lib/styles.css" />
  </head>
  <body>
    <div class="lobby">
      <h1 class="lobby-title">UNDERCOVER</h1>
      <p class="lobby-sub">Opening the game…</p>
      <div class="lobby-row">
        <a class="neon-btn neon-btn--accent" href="party.html?game=undercover&amp;fresh=1">PLAY UNDERCOVER</a>
        <a class="neon-btn" href="index.html">ALL GAMES</a>
      </div>
    </div>
    <script src="lib/pwa.js"></script>
    <script>
      const q = new URLSearchParams(location.search);
      q.set("game", "undercover");
      // A fresh visit starts a new party; a carried link joins one.
      if (!location.hash) q.set("fresh", "1");
      location.replace("party.html?" + q + location.hash);
    </script>
  </body>
</html>
