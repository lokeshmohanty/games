<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party — Arcade Games</title>
    <!-- The arcade is one page since 2026-11-15 (docs/spa.md): this old address
         forwards there, keeping its query and any invite in the hash. -->
    <meta http-equiv="refresh" content="0; url=./?party" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <p><a href="./?party">Open the party</a></p>
    <script>
      const q = new URLSearchParams(location.search);
      // The party, whatever else rides along (?mockroom, ?rs…): src/router.ts reads these.
      if (!["game", "mode", "fresh", "dev", "party", "rs"].some((k) => q.has(k))) q.set("party", "");
      location.replace("./?" + q.toString().replace(/=(&|$)/g, "$1") + location.hash);
    </script>
  </body>
</html>
