<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Tug of War — P2P</title>
    <!-- Installable: manifest + icons, registered by lib/pwa.js. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Neon Arcade" />
    <link rel="stylesheet" href="lib/styles.css" />
  </head>
  <body>
    <!--
      A deep link straight into one game. The game itself lives in
      games/tug-of-war.js and is mounted here exactly as party.html mounts
      it; this page only supplies the two-player lobby around it.
    -->
    <a class="portal-link" href="index.html">&#8592; All games</a>
    <div id="lobby"></div>
    <div id="stage" hidden></div>

    <script src="lib/pwa.js"></script>
    <script src="lib/qr.js"></script>
    <script src="lib/qr-decode.js"></script>
    <script src="lib/net.js"></script>
    <script src="lib/games.js"></script>
    <script src="lib/lobby.js"></script>
    <script src="games/tug-of-war.js"></script>
    <script>
      NeonArcade.mountGamePage(
        document.getElementById("lobby"),
        document.getElementById("stage"),
        "tug-of-war",
      );
    </script>
  </body>
</html>
