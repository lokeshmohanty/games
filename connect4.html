<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Connect 4 — P2P</title>
    <link rel="stylesheet" href="lib/styles.css" />
    <style>
      #game {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 12px;
      }
      #hud {
        font-size: clamp(0.9rem, 3vw, 1.2rem);
        color: var(--accent);
        text-shadow: 0 0 8px var(--accent-glow);
        text-align: center;
        min-height: 1.5em;
      }
      #hud .you-red {
        color: #ff4d4d;
        text-shadow: 0 0 8px rgba(255, 77, 77, 0.5);
      }
      #hud .you-yellow {
        color: #ffd24d;
        text-shadow: 0 0 8px rgba(255, 210, 77, 0.5);
      }
      #hud .you-spec {
        color: var(--muted);
      }
      #board {
        border: 3px solid #2a2a4e;
        border-radius: 12px;
        box-shadow: 0 0 30px rgba(0, 100, 255, 0.2);
        max-width: 95vw;
        max-height: 70vh;
      }
      #overlay p {
        color: var(--muted);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="lobby"></div>
    <div id="game" hidden>
      <div id="hud"></div>
      <canvas id="board"></canvas>
    </div>
    <div id="overlay" class="overlay" hidden></div>

    <script src="lib/qr.js"></script>
    <script src="lib/net.js"></script>
    <script src="lib/lobby.js"></script>
    <script>
      const { mountLobby } = window.NeonArcade;

      const COLS = 7;
      const ROWS = 6;
      const RED = 1;
      const YELLOW = 2;

      const lobbyEl = document.getElementById("lobby");
      const gameEl = document.getElementById("game");
      const hudEl = document.getElementById("hud");
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const overlayEl = document.getElementById("overlay");

      let room = null;
      let state = {
        board: emptyBoard(),
        turn: RED,
        winner: null,
        started: false,
        opponentId: null,
      };
      let myColor = 0; // RED=1 (host), YELLOW=2 (opponent), 0=spectator
      let hoverCol = -1;

      function emptyBoard() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      }

      function resize() {
        const maxW = Math.min(window.innerWidth - 24, 560);
        const maxH = window.innerHeight - 140;
        const cell = Math.max(
          20,
          Math.floor(Math.min(maxW / COLS, maxH / ROWS)),
        );
        canvas.width = cell * COLS;
        canvas.height = cell * ROWS;
        draw();
      }
      window.addEventListener("resize", resize);

      function draw() {
        const cell = canvas.width / COLS;
        // board background
        ctx.fillStyle = "#1a1a2e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // hover highlight
        if (
          hoverCol >= 0 &&
          hoverCol < COLS &&
          state.winner === null &&
          canPlay()
        ) {
          ctx.fillStyle = "rgba(0, 255, 255, 0.08)";
          ctx.fillRect(hoverCol * cell, 0, cell, canvas.height);
        }
        // discs / holes
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const x = c * cell + cell / 2;
            const y = r * cell + cell / 2;
            const val = state.board[r][c];
            ctx.beginPath();
            ctx.arc(x, y, cell * 0.4, 0, Math.PI * 2);
            if (val === 0) {
              ctx.fillStyle = "#0a0a0a";
              ctx.fill();
            } else {
              const color = val === RED ? "#ff4d4d" : "#ffd24d";
              ctx.shadowBlur = 15;
              ctx.shadowColor = color;
              ctx.fillStyle = color;
              ctx.fill();
              ctx.shadowBlur = 0;
            }
          }
        }
      }

      function canPlay() {
        return (
          state.started &&
          state.winner === null &&
          myColor !== 0 &&
          state.opponentId !== null
        );
      }

      function dropRow(col) {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (state.board[r][col] === 0) return r;
        }
        return -1;
      }

      function checkWin(board, row, col, player) {
        const dirs = [
          [0, 1],
          [1, 0],
          [1, 1],
          [1, -1],
        ];
        for (const [dr, dc] of dirs) {
          let count = 1;
          for (let d = 1; d < 4; d++) {
            const r = row + dr * d,
              c = col + dc * d;
            if (
              r < 0 ||
              r >= ROWS ||
              c < 0 ||
              c >= COLS ||
              board[r][c] !== player
            )
              break;
            count++;
          }
          for (let d = 1; d < 4; d++) {
            const r = row - dr * d,
              c = col - dc * d;
            if (
              r < 0 ||
              r >= ROWS ||
              c < 0 ||
              c >= COLS ||
              board[r][c] !== player
            )
              break;
            count++;
          }
          if (count >= 4) return true;
        }
        return false;
      }

      function isDraw(board) {
        return board[0].every((v) => v !== 0);
      }

      function applyMove(col, player) {
        const row = dropRow(col);
        if (row < 0) return false;
        state.board[row][col] = player;
        if (checkWin(state.board, row, col, player)) {
          state.winner = player;
        } else if (isDraw(state.board)) {
          state.winner = 0;
        } else {
          state.turn = player === RED ? YELLOW : RED;
        }
        return true;
      }

      function updateHud() {
        hudEl.replaceChildren();
        const colorSpan = document.createElement("span");
        if (myColor === RED) colorSpan.className = "you-red";
        else if (myColor === YELLOW) colorSpan.className = "you-yellow";
        else colorSpan.className = "you-spec";
        colorSpan.textContent =
          myColor === RED ? "RED" : myColor === YELLOW ? "YELLOW" : "SPECTATOR";

        if (!state.started) {
          hudEl.append(colorSpan);
          return;
        }
        if (state.winner !== null) {
          let msg;
          if (state.winner === 0) msg = " — DRAW";
          else if (state.winner === myColor) msg = " — YOU WIN!";
          else msg = " — YOU LOSE";
          hudEl.append(colorSpan, document.createTextNode(msg));
          return;
        }
        if (state.opponentId === null) {
          hudEl.append(
            colorSpan,
            document.createTextNode(" — Waiting for opponent…"),
          );
          return;
        }
        const turnMsg =
          state.turn === myColor ? " — YOUR TURN" : " — Opponent's turn";
        hudEl.append(colorSpan, document.createTextNode(turnMsg));
      }

      function showOverlay(msg, btnText, btnCb) {
        overlayEl.replaceChildren();
        const h1 = document.createElement("h1");
        h1.textContent = msg;
        overlayEl.append(h1);
        if (btnText) {
          const btn = document.createElement("button");
          btn.className = "neon-btn";
          btn.textContent = btnText;
          btn.onclick = btnCb;
          overlayEl.append(btn);
        }
        overlayEl.hidden = false;
      }

      function hideOverlay() {
        overlayEl.hidden = true;
      }

      function afterMove() {
        draw();
        updateHud();
        if (state.winner !== null) {
          let msg;
          if (state.winner === 0) msg = "DRAW";
          else if (state.winner === myColor) msg = "YOU WIN!";
          else msg = "YOU LOSE";
          if (room && room.isHost()) {
            showOverlay(msg, "REMATCH", rematch);
          } else {
            showOverlay(msg, null, null);
            const p = document.createElement("p");
            p.textContent = "Waiting for host to rematch…";
            overlayEl.append(p);
          }
        }
      }

      function rematch() {
        state = {
          board: emptyBoard(),
          turn: RED,
          winner: null,
          started: true,
          opponentId: state.opponentId,
        };
        hideOverlay();
        draw();
        updateHud();
        broadcastState();
      }

      function broadcastState() {
        if (room && room.isHost()) {
          room.makeAction("state").send(state);
        }
      }

      // Input
      function handleClick(clientX) {
        if (!canPlay() || state.turn !== myColor) return;
        const rect = canvas.getBoundingClientRect();
        const col = Math.floor((clientX - rect.left) / (rect.width / COLS));
        if (col < 0 || col >= COLS) return;
        if (room.isHost()) {
          if (applyMove(col, myColor)) {
            broadcastState();
            afterMove();
          }
        } else {
          room.makeAction("move").send({ col }, { target: room.hostId() });
        }
      }

      canvas.addEventListener("click", (e) => handleClick(e.clientX));
      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const col = Math.floor((e.clientX - rect.left) / (rect.width / COLS));
        if (col !== hoverCol) {
          hoverCol = col;
          draw();
        }
      });
      canvas.addEventListener("mouseleave", () => {
        hoverCol = -1;
        draw();
      });
      canvas.addEventListener(
        "touchstart",
        (e) => {
          handleClick(e.touches[0].clientX);
          e.preventDefault();
        },
        { passive: false },
      );

      // Networking
      mountLobby(lobbyEl, {
        gameName: "CONNECT 4",
        onReady(r) {
          room = r;
          myColor = room.isHost() ? RED : 0; // refined when state arrives

          const stateAction = room.makeAction("state");
          const moveAction = room.makeAction("move");

          stateAction.onMessage = (data) => {
            state = data;
            myColor = room.isHost()
              ? RED
              : state.opponentId === room.selfId
                ? YELLOW
                : 0;
            draw();
            updateHud();
            if (state.winner !== null) afterMove();
            else hideOverlay();
          };

          moveAction.onMessage = (data, { peerId }) => {
            if (!room.isHost()) return;
            if (state.turn !== YELLOW || peerId !== state.opponentId) return;
            if (applyMove(data.col, YELLOW)) {
              broadcastState();
              afterMove();
            }
          };
        },
        onPeerJoin(peerId) {
          if (room.isHost()) {
            if (!state.opponentId) {
              state.opponentId = peerId;
            }
            // send current state to the new peer (late join / initial)
            room.makeAction("state").send(state, { target: peerId });
            broadcastState(); // let everyone know the opponent
            if (state.started) hideOverlay();
            updateHud();
          }
          myColor = room.isHost()
            ? RED
            : state.opponentId === room.selfId
              ? YELLOW
              : 0;
          updateHud();
        },
        onPeerLeave(peerId) {
          if (room.isHost()) {
            if (state.opponentId === peerId) {
              const remaining = room.getPeers().filter((p) => p !== peerId);
              state.opponentId = remaining[0] || null;
              if (!state.opponentId && state.started && state.winner === null) {
                state.winner = RED; // host wins by forfeit (opponent left)
              }
              broadcastState();
              afterMove();
            }
          }
          myColor = room.isHost()
            ? RED
            : state.opponentId === room.selfId
              ? YELLOW
              : 0;
          updateHud();
        },
        onStart() {
          gameEl.hidden = false;
          if (room.isHost()) {
            state = {
              board: emptyBoard(),
              turn: RED,
              winner: null,
              started: true,
              opponentId: room.getPeers()[0] || null,
            };
            broadcastState();
            if (!state.opponentId) {
              showOverlay("Waiting for opponent to join…", null, null);
            }
          }
          resize();
          draw();
          updateHud();
        },
      });
    </script>
  </body>
</html>
